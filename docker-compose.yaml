services:
  tailer:
    image: maptiler/tileserver-gl
    restart: always
    ports:
    - 8086:8080
    volumes:
    - ./pmtiles:/data
  osrm:
    image: ghcr.io/project-osrm/osrm-backend
    command: osrm-routed /data/world
    restart: always
    ports:
    - 5000:5000
    volumes:
    - ./osm:/data
    - ./world.pbf:/data/world.pbf
  watch:
    build:
      context: ./watch
    restart: always
    volumes:
    - "./watch/config.yml:/app/config.yml"
    